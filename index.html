<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caixa d'Água</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#0b0f1a;
  color:#fff;
  font-family:Arial,sans-serif
}

.dashboard{
  max-width:620px;
  margin:auto;
  padding:18px
}

.titulo-box{
  text-align:center;
  position:relative
}

.titulo-box h2{
  margin:5px 0
}

.subtitulo{
  color:#94a3b8
}

.gear{
  position:absolute;
  right:0;
  top:0;
  font-size:24px
}

.card-tank{
  background:#1e293b;
  border-radius:18px;
  padding:18px;
  margin:15px 0;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.card-chart{
  background:#1e293b;
  border-radius:18px;
  padding:18px;
  margin:15px 0;
  text-align:center;
}

/* =========================
   CAIXA D'ÁGUA
   ========================= */

.tank{
  height:250px;
  width:260px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  border-radius:32px 32px 20px 20px;
  background:#0f172a;
  border:4px solid #64748b;
  transform:translateX(-5px);
}

/* ÁGUA - fica atrás do PNG */
.water{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0;
  background:linear-gradient(to top,#0077ff,#00c6ff);
  transition:height .5s;
  z-index:1
}

.water.low{
  background:linear-gradient(to top,#ff7b00,#ffc107)
}

/* PNG - fica por cima da água */
.tank-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  opacity:1;
  z-index:2;
  pointer-events:none
}

/* Borda frontal */
.glass{
  position:absolute;
  inset:0;
  border:2px solid #cbd5e1;
  border-radius:24px;
  z-index:3;
  pointer-events:none
}

.alerta-grande{
  position:absolute;
  z-index:5;
  top:8px;
  left:5px;
  right:5px;
  font-size:12px;
  font-weight:bold
}

/* =========================
   AUTOMAÇÃO
   ========================= */

.auto-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.auto-item{
  background:#0f172a;
  padding:10px;
  border-radius:10px;
  font-size:12px
}

.auto-item b{
  display:block;
  margin-top:5px
}

.auto-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px
}

.auto-buttons button,
.btn-navegacao{
  padding:12px;
  border:0;
  border-radius:10px;
  color:#fff;
  font-weight:bold;
  cursor:pointer
}

.btn-on{
  background:#22c55e
}

.btn-off{
  background:#ef4444
}

.btn-auto{
  background:#3b82f6
}

.btn-manual{
  background:#f59e0b
}

.btn-navegacao{
  width:100%;
  background:#334155;
  margin-bottom:15px
}

.card-chart h3{
  margin-top:0
}

/* =========================
   CELULAR
   ========================= */

@media(max-width:480px){

  .auto-grid{
    grid-template-columns:repeat(2,1fr)
  }

}
</style>

</head>

<body>

<div class="dashboard">

  <!-- TÍTULO -->
  <div class="titulo-box">

    <h2>CAIXA D’ÁGUA</h2>

    <p class="subtitulo">
      Monitoramento e automação
    </p>

    <div class="gear"
         onclick="location.href='config.html'">
      ⚙️
    </div>

  </div>


  <!-- CAIXA -->
  <div class="card-tank">

    <div class="tank">

      <!-- ÁGUA -->
      <div id="water"
           class="water">
      </div>

      <!-- ALERTA -->
      <div id="alertaGrande"
           class="alerta-grande">
      </div>

      <!-- IMAGEM DA CAIXA -->
      <img src="caixa.png"
           class="tank-img"
           onerror="this.style.display='none'">

      <!-- VIDRO / BORDA -->
      <div class="glass"></div>

    </div>


    <h1 id="percent">
      0%
    </h1>

    <h2 id="litrosText">
      0 L
    </h2>

    <p id="status">
      Inicializando...
    </p>

  </div>


  <!-- AUTOMAÇÃO -->
  <div class="card-chart">

    <h3>
      ⚙️ AUTOMAÇÃO
    </h3>


    <!-- STATUS -->
    <div class="auto-grid">

      <div class="auto-item">
        Bomba
        <b id="statusBomba">-</b>
      </div>

      <div class="auto-item">
        Modo
        <b id="modoAutomacao">-</b>
      </div>

      <div class="auto-item">
        Sonoff
        <b id="statusSonoff">-</b>
      </div>

      <div class="auto-item">
        Wi-Fi
        <b id="wifiRssi">-</b>
      </div>

    </div>


    <!-- BOIAS -->
    <div class="auto-grid"
         style="margin-top:8px">

      <div class="auto-item">
        20%
        <b id="boia20">⚪</b>
      </div>

      <div class="auto-item">
        40%
        <b id="boia40">⚪</b>
      </div>

      <div class="auto-item">
        60%
        <b id="boia60">⚪</b>
      </div>

      <div class="auto-item">
        80%
        <b id="boia80">⚪</b>
      </div>

    </div>


    <!-- BOTÕES -->
    <div class="auto-buttons">

      <button class="btn-on"
              onclick="comandoBomba('ON')">
        🟢 LIGAR
      </button>

      <button class="btn-off"
              onclick="comandoBomba('OFF')">
        🔴 DESLIGAR
      </button>

      <button class="btn-auto"
              onclick="comandoModo('AUTO')">
        🤖 AUTOMÁTICO
      </button>

      <button class="btn-manual"
              onclick="comandoModo('MANUAL')">
        🖐️ MANUAL
      </button>

    </div>


    <p>
      Segurança:
      <b id="sistemaSeguro">-</b>
    </p>


    <p style="font-size:12px;color:#94a3b8">
      Último evento:
      <span id="ultimoEvento">-</span>
    </p>

  </div>


  <!-- CONFIGURAÇÕES -->
  <button class="btn-navegacao"
          onclick="location.href='config.html'">
    ⚙️ CONFIGURAÇÕES
  </button>


  <!-- GASTO -->
  <div class="card-chart">

    <h3>
      💧 GASTO HOJE
    </h3>

    <h1 id="gastoHoje">
      0 L
    </h1>

  </div>


  <!-- GRÁFICO -->
  <div class="card-chart">

    <h3>
      📊 Consumo dos últimos dias
    </h3>

    <canvas id="graficoConsumo"></canvas>

  </div>

</div>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>


<!-- CHART.JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<!-- SEU SCRIPT -->
<script src="script.js"></script>

</body>
</html>
